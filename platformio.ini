; DIY thermal camera
; Waveshare ESP32-C6-LCD-1.47 + Pimoroni MLX90640 breakout
;
; The official espressif32 platform does not ship Arduino core 3.x (needed
; for the ESP32-C6), so we use the community pioarduino platform.

[env:esp32-c6-lcd-147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; The MLX90640 driver is Melexis's official API, vendored in lib/MLX90640
lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
